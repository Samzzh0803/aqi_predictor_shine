name: Daily Training

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke check Hopsworks secrets
        run: python -c "from src.config import get_settings; s=get_settings(); assert s.hopsworks_api_key and s.hopsworks_project, 'HOPSWORKS_API_KEY and HOPSWORKS_PROJECT must be set'"
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}

      - name: Run daily training and promotion check
        run: python -c "from src.pipelines.train import run_daily_training_job; run_daily_training_job()"
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
